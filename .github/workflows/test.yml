name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Pin Python to 3.12 to match the Dockerfile runtime and the plugin
      # install path below.
      - name: Set up Python 3.12
        run: uv python install 3.12

      # Install from the lock file so pinned versions (arelle, fastapi, ...)
      # are respected exactly, including the dev group (pytest, httpx).
      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      # The validator runs Arelle with the XULE plugin for cross-field rules.
      # The Dockerfile copies the vendored plugin into Arelle's plugin dir; CI
      # must do the same or the golden broken-instance test (a XULE rule) would
      # not fire.
      - name: Install XULE plugin into Arelle
        run: cp -R xule_plugin .venv/lib/python3.12/site-packages/arelle/plugin/xule

      # The validator forces offline mode and resolves against the bundled
      # cache/, so this run performs no network fetch of the taxonomy.
      - name: Run tests
        run: uv run pytest -v
